<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – cupons</title>
<style>
:root{--bg:#f6f7f9;--text:#1c1e21;--card:#fff;--border:#d1d5db}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--text:#eceff4;--card:#1a1d24;--border:#2a2f3a}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);max-width:900px;margin:0 auto;padding:16px}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;background:var(--card);padding:14px;border:1px solid var(--border);border-radius:10px}
label{font-size:.8rem;display:flex;flex-direction:column;gap:4px}
input{padding:8px;border:1px solid var(--border);border-radius:6px;background:transparent;color:inherit}
button{padding:9px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:.85rem}td,th{border-bottom:1px solid var(--border);padding:6px;text-align:left}
</style></head>
<body>
<h1>Cupons</h1>
<form class="add" method="post" action="/admin/coupons">
<input type="hidden" name="token" value="{{ token }}">
<label>Código<input name="code" required></label>
<label>Desconto %<input name="percent" type="number" step="0.01" value="0"></label>
<label>Valor fixo R$ (usa no lugar do %)<input name="fixed_amount" type="number" step="0.01" value="0"></label>
<label>Desconto máximo R$ (0 = sem teto)<input name="max_discount" type="number" step="0.01" value="0"></label>
<label>Compra mínima R$<input name="min_purchase" type="number" step="0.01" value="0"></label>
<label>Válido até<input name="valid_until" type="date"></label>
<label>Termos aceitos (vírgula; vazio = todos)<input name="terms"></label>
<label>Link da campanha<input name="campaign_url"></label>
<button type="submit">Adicionar cupom</button>
</form>
<table>
<tr><th>Código</th><th>%</th><th>Fixo</th><th>Teto</th><th>Mínimo</th><th>Validade</th><th>Termos</th><th></th></tr>
{% for c in coupons %}
<tr><td>{{ c.code }}</td><td>{{ c.percent }}</td><td>{{ c.fixed_amount }}</td><td>{{ c.max_discount }}</td><td>{{ c.min_purchase }}</td>
<td>{{ c.valid_until.strftime('%d/%m/%Y') if c.valid_until else '—' }}</td><td>{{ c.terms or 'todos' }}</td>
<td><form method="post" action="/admin/coupons/{{ c.id }}/delete"><input type="hidden" name="token" value="{{ token }}"><button>Excluir</button></form></td></tr>
{% endfor %}
</table>
</body></html>
