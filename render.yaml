databases:
  - name: ofertas-db
    plan: free

services:
  # Site que mostra as ofertas
  - type: web
    name: ofertas-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ofertas-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AFFILIATE_URL_TEMPLATE
        sync: false

  # Rotina automática (busca preços, aplica cupons e publica) - plano pago
  - type: cron
    name: ofertas-worker
    runtime: python
    plan: starter
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ofertas-db
          property: connectionString
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: AFFILIATE_URL_TEMPLATE
        sync: false
      - key: SEARCH_TERMS
        value: fone bluetooth,air fryer,smartwatch
      - key: MIN_DISCOUNT_PCT
        value: "15"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
