databases:
  - name: ofertas-db
    plan: free

services:
  - type: web
    name: ofertas-ml
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: ofertas-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AFFILIATE_URL_TEMPLATE
        sync: false
